[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolens"
version = "0.1.0"
description = "AutoLens Egypt: multi-source, multimodal intelligence platform for the Egyptian used-car market"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "psycopg[binary,pool]>=3.1,<4",
    "boto3>=1.34,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "tzdata",
]

[project.optional-dependencies]
scraping = ["beautifulsoup4>=4.12", "lxml>=5", "tenacity>=8.2", "selectolax>=0.3"]
linkage = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "rapidfuzz>=3.6", "networkx>=3.2"]
warehouse = ["pandas>=2.1", "sqlalchemy>=2.0,<3"]
analytics = ["pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14", "lifelines>=0.28"]
vision = ["torch>=2.2", "torchvision>=0.17", "pillow>=10", "opencv-python-headless>=4.9", "imagehash>=4.3", "numpy>=1.26"]
nlp = ["pandas>=2.1", "numpy>=1.26", "torch>=2.2", "transformers>=4.40", "sentence-transformers>=2.7"]
pricing = ["pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "lightgbm>=4.3", "torch>=2.2", "mlflow-skinny>=2.12"]
api = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29", "mlflow-skinny>=2.12"]
dashboard = ["streamlit>=1.33", "pandas>=2.1", "plotly>=5.20"]
pipelines = ["prefect>=3.1,<4", "mlflow-skinny>=2.12"]
mlops = ["mlflow-skinny>=2.12"]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
    "sqlfluff>=3.0",
    "schemathesis>=3.30",
    "types-PyYAML",
    "fastapi>=0.110,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S101"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs PostgreSQL and MinIO (CI e2e job or make up)"]
