name: cd

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, pipeline, dashboard]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.image }}:latest

  deploy-staging:
    needs: build-push
    if: github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    runs-on: [self-hosted, staging]
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: deploy
        run: |
          export IMAGE_TAG=${{ github.sha }}
          docker compose --env-file "${AUTOLENS_ENV_FILE:-.env}" -f docker/docker-compose.yml pull
          docker compose --env-file "${AUTOLENS_ENV_FILE:-.env}" -f docker/docker-compose.yml up -d
      - name: smoke test
        run: curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/health

  deploy-production:
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_ENABLED == 'true'
    runs-on: [self-hosted, production]
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: deploy
        run: |
          export IMAGE_TAG=${{ github.sha }}
          docker compose --env-file "${AUTOLENS_ENV_FILE:-.env}" -f docker/docker-compose.yml pull
          docker compose --env-file "${AUTOLENS_ENV_FILE:-.env}" -f docker/docker-compose.yml up -d
      - name: smoke test
        run: curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8000/health
